name: Validate Chile State Institutional Map

on:
  push:
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "sources.csv"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "sources.csv"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate institutional datasets
        run: python scripts/validate.py
